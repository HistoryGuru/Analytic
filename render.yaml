services:
  - type: web
    name: ld-scout-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TABROOM_USERNAME
        sync: false
      - key: TABROOM_PASSWORD
        sync: false
      - key: OPENCASELIST_USERNAME
        sync: false
      - key: OPENCASELIST_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CASELIST_SLUG
        value: hsld26
      - key: DEBATELAND_SEASON
        value: SY_25_26
      - key: DEBATELAND_CIRCUITS
        value: National,Local
      - key: CACHE_TTL_SECONDS
        value: "900"
      - key: CORS_ORIGINS
        value: "*"
